[project]
name = "ai-agent-lab"
version = "0.1.0"
description = "Learning lab for AI agents; reuse-first."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-openai>=1.7,<2",
    "pydantic-ai-slim[openai]>=2.62,<3",
    "python-dotenv>=1.2",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "openinference-instrumentation-langchain>=0.1.80",
    "openinference-instrumentation-pydantic-ai>=0.1.30",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["phase-03", "phase-03/common", "phase-02", "phase-02/common", "phase-01", "phase-01/common", "phase-01/langgraph-agent", "phase-01/pydantic-ai-agent"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs a real model provider configured in .env (skipped otherwise)"]
